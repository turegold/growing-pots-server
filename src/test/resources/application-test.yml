spring:
  datasource:
    url: jdbc:h2:mem:growingpots-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  # 마이그레이션은 MySQL 전용 문법(enum, ENGINE=InnoDB 등)이라 H2에서 실행되지 않는다.
  # 테스트는 매번 깨끗한 스키마에서 시작해야 하므로 Hibernate가 직접 생성하게 둔다.
  # 다만 이 때문에 테스트가 검증하는 스키마와 실제 MySQL 스키마가 다르다는 한계가 있다.
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email,profile

jwt:
  secret: test-secret-key-must-be-at-least-32-characters
  expiration: 1800000

app:
  base-url: http://localhost:8080
