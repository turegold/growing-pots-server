spring:
  # 로컬 개발용 비밀값(DB 비밀번호 등)을 담는 파일. gitignore 대상이라 저장소에 올라가지 않는다.
  # 없어도(optional) 정상 동작하므로 CI·배포 환경에서는 환경변수를 그대로 쓴다.
  config:
    import: optional:classpath:application-secret.yml
  application:
    name: growing-pots
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 스키마 변경은 전부 db/migration의 마이그레이션 파일로만 한다.
  # 운영 DB가 없는 상태에서 시작하므로 baseline 없이 V1부터 적용한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
    with-credentials: true

oauth:
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${spring.profiles.active}
  send-default-pii: false

# 구글시트 기반 시드 데이터(과목/학과 등) 동기화. Apps Script의 "DB 반영" 트리거가
# sync-token을 헤더로 실어 호출하면, 서버가 서비스 계정으로 시트를 직접 읽어온다.
admin:
  sync-token: ${ADMIN_SYNC_TOKEN:}

seed-data:
  spreadsheet-id: ${SEED_DATA_SPREADSHEET_ID:}
  google-credentials-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:}