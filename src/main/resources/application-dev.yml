server:
  port: 18081

spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  secret: ${DEV_JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 1209600000

app:
  base-url: ${APP_BASE_URL:http://localhost:18081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

logging:
  level:
    com.growingpots: debug
