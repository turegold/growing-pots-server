spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:growingpots}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-characters}
  expiration: 1800000
  refresh-expiration: 1209600000

app:
  base-url: http://localhost:8080

cookie:
  secure: false
  same-site: Lax

cors:
  allowed-origins: http://localhost:3000

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

admin:
  sync-token: local-dev-admin-token

seed-data:
  spreadsheet-id: ${SEED_DATA_SPREADSHEET_ID:1EAGkStPnvbiG_gvK-OqW57ZZ6lnnGg054uLBhDjUpNU}
  # 파이썬 크롤러/파서 스크립트가 이미 쓰고 있는 서비스 계정 키 파일 경로를 셸 환경변수로 지정해서 재사용한다.
  google-credentials-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:}

logging:
  level:
    com.growingpots: debug
    org.hibernate.SQL: debug
